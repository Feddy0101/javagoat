<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            
            for (let i_ula = 0; i_ula <= 15; i_ula++) {

                let x_ula = i_ula + 15;
                let p2_ula = Math.sqrt(i_ula + 15);
                let p4_ula = Math.sqrt(p2_ula);

                document.write(`p_2(${x_ula}) = ${p2_ula.toFixed(2)} &nbsp &nbsp &nbsp p_4(${x_ula}) = ${p4_ula.toFixed(2)}<br>`)
            }
            
        </script>
    </body>
</html>
