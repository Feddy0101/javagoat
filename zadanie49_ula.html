<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <div style="color:red; font-size: 50px;">
            <script>
                do {
                    var a_ula = parseFloat(prompt("bok a = "));
                    var b_ula = parseFloat(prompt("bok b = "));
                    var c_ula = parseFloat(prompt("bok c = "));
                    document.write("sprawdzam warunki dla trójkąta dla wczytanych danych<br>");
                }
                while (!((a_ula > 0) && (b_ula > 0) && (c_ula > 0) && (a_ula + b_ula > c_ula) && (a_ula + c_ula > b_ula) && (c_ula + b_ula > a_ula)));

                document.write("wyrok: trójkąt się zamyka oraz boki są dodatnie");
            </script>
        </div>
    </body>
</html>
