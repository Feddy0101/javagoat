<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            let a_ula = 6;
            let b_ula = 21;

            for (let i_ula = 0; i_ula < b_ula; i_ula++) {
                document.write("*");
            }
            document.write("<br>");
            
            for (let i_ula = 0; i_ula < a_ula - 2; i_ula++) {
                document.write("*");
                for (let x_ula = 0; x_ula < b_ula - 2; x_ula++) {
                    document.write("&nbsp ");
                }
                document.write("*<br>");
            }

            for (let i_ula = 0; i_ula < b_ula; i_ula++) {
                document.write("*");
            }
        </script>
    </body>
</html>
