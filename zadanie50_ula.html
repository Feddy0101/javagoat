<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            let suma_ula = 0;
            for (i_ula = 1; i_ula <= 1000000; i_ula++) {
                suma_ula += 1 / i_ula;
            }
            document.write(`<p>suma = ${suma_ula.toFixed(2)}</p>`);
        </script>
    </body>
</html>
